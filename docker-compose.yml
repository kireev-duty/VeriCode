# ФСП Талант: `docker compose up -d --build`, затем http://localhost:8080
#   /            веб-приложение (кандидат и работодатель)
#   /api/docs    Swagger (OpenAPI)
#   /auth        ФСП ID (Keycloak, realm "fsp") — демонстрация совместимой авторизации
#   /mail        почтовый ящик для писем подтверждения (Mailpit)

x-backend-env: &backend-env
  DATABASE_URL: postgresql+psycopg://fsp:${POSTGRES_PASSWORD:-fsp}@db:5432/fsp
  JWT_SECRET: ${JWT_SECRET:-change-me-please-long-random-string-0123456789}
  PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8080}
  CORS_ORIGINS: '["${PUBLIC_URL:-http://localhost:8080}"]'
  SMTP_HOST: mailpit
  SMTP_PORT: "1025"
  EXPOSE_EMAIL_LINKS: ${EXPOSE_EMAIL_LINKS:-true}
  FSP_OIDC_ENABLED: ${FSP_OIDC_ENABLED:-true}
  FSP_OIDC_ISSUER: http://keycloak:8080/auth/realms/fsp
  FSP_OIDC_PUBLIC_ISSUER: ${PUBLIC_URL:-http://localhost:8080}/auth/realms/fsp
  FSP_REGISTRY_URL: http://fsp_registry:8090
  # optional LLM over the rule-based NLP: none | gigachat | yandex (see docs/08-deploy.md)
  LLM_PROVIDER: ${LLM_PROVIDER:-none}
  LLM_API_KEY: ${LLM_API_KEY:-}
  LLM_MODEL: ${LLM_MODEL:-}
  LLM_SCOPE: ${LLM_SCOPE:-GIGACHAT_API_PERS}
  LLM_FOLDER_ID: ${LLM_FOLDER_ID:-}
  LLM_VERIFY_SSL: ${LLM_VERIFY_SSL:-true}
  LLM_CA_BUNDLE: ${LLM_CA_BUNDLE:-certs/russian_trusted_ca.pem}  # Russian Trusted Root + Sub CA (GigaChat)
  LLM_TIMEOUT: ${LLM_TIMEOUT:-30}
  # local open-weight model (LLM_PROVIDER=local or gigachat,local): docker compose --profile local-llm up -d
  LOCAL_LLM_URL: ${LOCAL_LLM_URL:-http://ollama:11434/v1}
  LOCAL_LLM_MODEL: ${LOCAL_LLM_MODEL:-qwen3:4b-instruct}
  # anonymised export of pilot test sessions for validation/pilot.py; empty = disabled
  PILOT_EXPORT_TOKEN: ${PILOT_EXPORT_TOKEN:-}

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fsp
      POSTGRES_USER: fsp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fsp}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fsp -d fsp"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  backend:
    build: ./backend
    environment:
      <<: *backend-env
      SEED_DEMO: ${SEED_DEMO:-true}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  fsp_registry:
    build: ./backend
    command: ["uvicorn", "app.modules.fsp.registry_app:app", "--host", "0.0.0.0", "--port", "8090"]
    environment:
      RUN_MIGRATIONS: "false"
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.1
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HTTP_RELATIVE_PATH: /auth
      KC_HOSTNAME: ${PUBLIC_URL:-http://localhost:8080}/auth
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HTTP_ENABLED: "true"
      JAVA_OPTS_KC_HEAP: "-XX:MaxRAMPercentage=50 -Xms128m -Xmx512m"
    volumes:
      - ./deploy/keycloak/realm-fsp.json:/opt/keycloak/data/import/realm-fsp.json:ro
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.21
    environment:
      MP_WEBROOT: /mail/
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "${HTTP_BIND:-0.0.0.0}:${HTTP_PORT:-8080}:80"  # HTTP_BIND=127.0.0.1 behind Caddy
    depends_on:
      - backend
    restart: unless-stopped

  # Ollama (MIT) + Qwen3 4B Instruct (Apache-2.0): optional, ~3 GB of RAM, pulls the model on first start
  ollama:
    image: ollama/ollama:0.40.0
    profiles: ["local-llm"]
    entrypoint: ["/bin/sh", "-c", "ollama serve & sleep 3 && ollama pull \"$$LOCAL_LLM_MODEL\" && wait"]
    environment:
      LOCAL_LLM_MODEL: ${LOCAL_LLM_MODEL:-qwen3:4b-instruct}
      OLLAMA_KEEP_ALIVE: 24h
    ports:
      - "127.0.0.1:11434:11434"  # for a backend started with uv run
    volumes:
      - ollama:/root/.ollama
    restart: unless-stopped

volumes:
  pgdata:
  ollama:
